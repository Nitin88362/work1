<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selfie Admin | Uttarakhand Police</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/admin.css"></head><body><main class="container py-4 py-lg-5"><section id="loginView" class="login-card mx-auto"><div class="brand-icon"><i class="bi bi-shield-lock-fill"></i></div><p class="eyebrow">SECURE ACCESS</p><h1>Admin Panel</h1><p class="text-secondary">Saved campaign selfies देखने के लिए login करें।</p><form id="loginForm"><label class="form-label" for="password">Admin password</label><input class="form-control form-control-lg" id="password" type="password" required autocomplete="current-password"><button class="btn btn-primary btn-lg w-100 mt-3" type="submit">Login</button><p id="loginError" class="error mt-3 mb-0"></p></form></section><section id="dashboardView" class="d-none"><header class="dashboard-head"><div><p class="eyebrow mb-1">CYBER SELFIE CAMPAIGN</p><h1>Participant Selfies</h1><p id="summary" class="text-secondary mb-0">Loading…</p></div><button id="logoutBtn" class="btn btn-outline-light"><i class="bi bi-box-arrow-right"></i> Logout</button></header><div id="emptyState" class="empty-state d-none"><i class="bi bi-images"></i><h2>अभी कोई selfie नहीं है</h2><p>Participant के photo capture करते ही यहाँ दिखाई देंगे।</p></div><div id="gallery" class="gallery"></div></section></main><script src="/js/admin.js"></script></body></html>
