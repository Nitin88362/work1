<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Cyber Jaagruti Abhiyaan | Uttarakhand Police</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Oswald:wght@500;600;700&family=Noto+Sans+Devanagari:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="page">
    <section class="experience">
      <header class="topbar"><h1>CYBER JAAGRUTI ABHIYAAN</h1><span>STEP <b id="stepNumber">01</b> / 03</span></header>

      <section class="screen active" id="screen1">
        <div class="screen-label"><small>TAKE SELFIE</small><h2>TAKE SELFIE</h2></div>
        <div class="campaign-poster">
          <div class="camera-window"><video id="video" autoplay playsinline muted></video><div class="camera-empty" id="cameraEmpty"><i class="bi bi-camera"></i><b>CAMERA READY</b><span>Camera access के लिए button दबाएँ</span></div><div class="face-guide"></div><span class="live-pill d-none" id="livePill">● LIVE</span></div>
        </div>
        <button class="capture-circle" id="cameraBtn" aria-label="Start camera"><i class="bi bi-camera-video-fill"></i></button>
        <button class="capture-circle d-none" id="captureBtn" aria-label="Take selfie"><i class="bi bi-camera-fill"></i></button>
      </section>

      <section class="screen" id="screen2">
        <div class="screen-label"><small>VIEW SELFIE</small><h2>ADJUST YOUR SHOT</h2></div>
        <div class="campaign-poster">
          <div class="photo-window"><img id="previewImage" alt="Captured selfie"></div>
        </div>
        <label class="zoom-label" for="zoomRange"><span>ZOOM</span><b id="zoomValue">100%</b></label><input id="zoomRange" type="range" min="100" max="180" value="100">
        <div class="two-actions"><button class="outline-action" id="retakeBtn">Retake</button><button class="main-action" id="continueBtn">Continue</button></div>
      </section>

      <section class="screen" id="screen3">
        <div class="screen-label share-heading"><small>SHARE</small><h2>सोशल मीडिया में <b>SHARE</b> करें</h2></div>
        <div class="final-wrap"><div class="final-poster"><div class="final-photo"><img id="finalImage" alt="Your cyber awareness selfie"></div></div></div>
        <div class="share-actions"><button class="share-action" id="shareBtn"><i class="bi bi-share"></i> Share</button><button class="outline-action" id="downloadBtn"><i class="bi bi-download"></i> Download</button><button class="outline-action" id="backBtn">‹ Back to edit</button><button class="outline-action" id="newBtn"><i class="bi bi-camera"></i> New photo</button></div><p class="share-tip">Tip: Share उपलब्ध न हो तो Download करके gallery से post करें</p>
      </section>
      <div id="toast" class="app-toast d-none"></div>
    </section>
  </main>
  <canvas id="rawCanvas" hidden></canvas><canvas id="posterCanvas" width="1080" height="1350" hidden></canvas>
  <script src="/js/app.js"></script>
</body>
</html>
